[package]
name = "sar-eval"
version = "0.1.0"
edition = "2021"
description = "Headless MCP research evaluation harness on the SAR message bus"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sar-core = { path = "../sar-core" }
sar-tool-mcp = { path = "../sar-tool-mcp" }
sar-tool-actors = { path = "../sar-tool-actors" }
sar-llm = { path = "../sar-llm" }
sar-llm-test-loop-tools = { path = "../sar-llm-test-loop-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
async-trait = "0.1"
